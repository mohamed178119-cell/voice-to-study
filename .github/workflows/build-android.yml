name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Detect build output folder
        id: outdir
        run: |
          if [ -f "dist/index.html" ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          elif [ -f ".output/public/index.html" ]; then
            echo "dir=.output/public" >> "$GITHUB_OUTPUT"
          elif [ -f "build/index.html" ]; then
            echo "dir=build" >> "$GITHUB_OUTPUT"
          else
            echo "No index.html found, listing .output:"
            ls -la .output 2>/dev/null || true
            ls -la .output/public 2>/dev/null || true
            exit 1
          fi

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << EOF
          {
            "appId": "com.mohamedsaad.voicetostudy",
            "appName": "Study Buddy AI",
            "webDir": "${{ steps.outdir.outputs.dir }}"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
